name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked environment
        run: python -m pip install uv==0.12.15 && uv sync --frozen --all-extras
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test with branch coverage gate
        run: uv run pytest
      - name: Scan public files
        run: uv run python scripts/check_sensitive.py
      - name: Source and supplied-history smoke tests
        env:
          CHURN_ID_SALT: ci-supplied-input-secret
        run: |
          uv run churn-pipeline run --project-root /tmp/churn-source --customers 180 --seed 7
          uv run churn-pipeline run --project-root /tmp/churn-input --input-transactions /tmp/churn-source/data/generated/transactions.csv.gz --observation-end 2026-06-30
          uv run churn-pipeline score --input-transactions /tmp/churn-source/data/generated/transactions.csv.gz --observation-end 2026-06-30 --model-bundle /tmp/churn-source/models/personalized_churn_model.joblib --output-root /tmp/churn-score
      - name: Build and smoke-test installed wheel
        env:
          CHURN_ID_SALT: ci-wheel-smoke-secret
        run: |
          uv build
          uv venv /tmp/churn-wheel-venv
          uv pip install --python /tmp/churn-wheel-venv/bin/python dist/*.whl
          mkdir -p /tmp/churn-wheel-cwd
          cd /tmp/churn-wheel-cwd
          /tmp/churn-wheel-venv/bin/churn-pipeline run --project-root /tmp/churn-wheel-run --customers 180 --seed 11
          /tmp/churn-wheel-venv/bin/churn-pipeline score --input-transactions /tmp/churn-wheel-run/data/generated/transactions.csv.gz --observation-end 2026-06-30 --model-bundle /tmp/churn-wheel-run/models/personalized_churn_model.joblib --output-root /tmp/churn-wheel-score
